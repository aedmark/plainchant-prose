[package]
name = "plainchant-prose"
version = "0.1.0"
description = "An offline-first plain-text long-form writer"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
